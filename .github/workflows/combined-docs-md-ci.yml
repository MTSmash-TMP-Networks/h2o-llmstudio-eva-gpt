name: Documentation

on:
  pull_request:
    paths:
      - "documentation/**"
      - "README.md"
      - "about.md"
      - ".github/workflows/combined-docs-md-ci.yml"
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - "README.md"
      - "about.md"
      - ".github/workflows/combined-docs-md-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate documentation sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify locked documentation dependencies
        working-directory: documentation
        run: npm ci

      - name: Check documentation sources
        shell: bash
        run: |
          mapfile -d '' markdown_files < <(
            find documentation/docs -type f -name '*.md' -print0 2>/dev/null
            printf '%s\0' README.md about.md
          )

          empty_files=()
          conflict_files=()
          for file in "${markdown_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing documentation file: $file"
              exit 1
            fi
            if [[ ! -s "$file" ]]; then
              empty_files+=("$file")
            fi
            if grep -Eq '^(<<<<<<< |>>>>>>> )' "$file"; then
              conflict_files+=("$file")
            fi
          done

          if (( ${#empty_files[@]} > 0 )); then
            printf 'Empty documentation file: %s\n' "${empty_files[@]}"
            exit 1
          fi

          if (( ${#conflict_files[@]} > 0 )); then
            printf 'Unresolved merge marker in: %s\n' "${conflict_files[@]}"
            exit 1
          fi

          printf 'Validated %s Markdown documentation files.\n' "${#markdown_files[@]}"

      - name: Package documentation sources
        run: |
          tar -czf documentation-sources.tar.gz \
            documentation/docs \
            documentation/package.json \
            documentation/package-lock.json \
            README.md \
            about.md

      - name: Upload documentation sources
        uses: actions/upload-artifact@v4
        with:
          name: documentation-sources
          path: documentation-sources.tar.gz
          if-no-files-found: error
          retention-days: 14
