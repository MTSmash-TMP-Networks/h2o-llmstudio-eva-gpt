name: UI Tests

on:
  pull_request:
    paths:
      - "llm_studio/app.py"
      - "llm_studio/app_utils/**"
      - "static/**"
      - "tests/ui/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/test_ui.yml"
  push:
    branches: [main]
    paths:
      - "llm_studio/app.py"
      - "llm_studio/app_utils/**"
      - "static/**"
      - "tests/ui/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/test_ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      H2O_WAVE_APP_ACCESS_KEY_ID: dev
      H2O_WAVE_APP_ACCESS_KEY_SECRET: dev
      H2O_WAVE_MAX_REQUEST_SIZE: 25MB
      H2O_WAVE_NO_LOG: "true"
      H2O_WAVE_PRIVATE_DIR: ${{ github.workspace }}/output/download
      LOCAL_LOGIN: "true"
      PYTEST_BASE_URL: http://127.0.0.1:10101
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install UI test dependencies
        run: uv sync --frozen --group dev

      - name: Prepare local UI fixture
        shell: bash
        run: |
          mkdir -p data/user/oasst reports output/download
          uv run --no-sync python - <<'PY'
          import pandas as pd

          rows = 100
          dataframe = pd.DataFrame(
              {
                  "id": [str(index) for index in range(rows)],
                  "parent_id": [None] * rows,
                  "system": ["You are a concise assistant."] * rows,
                  "instruction": [
                      f"Return the number {index}." for index in range(rows)
                  ],
                  "input": [""] * rows,
                  "output": [str(index) for index in range(rows)],
              }
          )
          dataframe.to_parquet("data/user/oasst/train_full.pq", index=False)
          PY

      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Prepare Wave theme
        run: make patch-wave-theme

      - name: Start application
        run: |
          nohup uv run --no-sync wave run --no-reload llm_studio.app \
            > reports/wave.log 2>&1 &
          echo $! > reports/wave.pid

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:10101/ >/dev/null; then
              echo "Application is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready in time."
          cat reports/wave.log
          exit 1

      - name: Run UI tests
        run: |
          uv run --no-sync pytest -v \
            --junitxml=reports/junit_ui.xml \
            --html=reports/pytest_ui.html \
            -o log_cli=true \
            -o log_level=INFO \
            -o log_file=reports/tests_ui.log \
            tests/ui/test.py

      - name: Stop application
        if: always()
        run: |
          if [[ -f reports/wave.pid ]]; then
            kill "$(cat reports/wave.pid)" 2>/dev/null || true
          fi
          pkill -f "wave run.*llm_studio.app" 2>/dev/null || true

      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
