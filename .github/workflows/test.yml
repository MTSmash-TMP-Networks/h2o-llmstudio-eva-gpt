name: Tests

on:
  pull_request:
    paths:
      - "llm_studio/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "llm_studio/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: CPU regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONPATH: ${{ github.workspace }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install test dependencies
        run: uv sync --frozen --group dev

      - name: Run fork regression suite
        shell: bash
        run: |
          mkdir -p reports
          uv run --no-sync pytest -v --import-mode importlib \
            --junitxml=reports/junit.xml \
            --html=reports/pytest.html \
            tests/src/datasets/test_fast_sliding_window.py \
            tests/src/datasets/test_fast_sliding_window_import.py \
            tests/src/datasets/test_supervised_sliding_window.py \
            tests/src/datasets/test_plain_text_rows.py::test_plain_text_rows_are_trained_raw_and_unmasked \
            tests/src/datasets/test_plain_text_rows.py::test_plain_text_rows_are_ignored_when_toggle_is_disabled \
            tests/src/datasets/test_text_causal_language_modeling_ds.py::test_skip_long_samples_in_training \
            tests/src/datasets/test_text_causal_language_modeling_ds.py::test_sliding_window_expands_long_training_samples \
            tests/src/datasets/test_text_causal_language_modeling_ds.py::test_mask_prompt_labels_keeps_prompt_format_tokens_trainable \
            tests/src/datasets/test_text_causal_language_modeling_ds.py::test_mask_prompt_user_text_only_restores_legacy_full_prompt_mask \
            tests/src/models/test_causal_language_modeling_sliding_window.py \
            tests/src/utils/test_train_text_column_config.py \
            tests/src/utils/test_logging_utils.py \
            tests/test_loss_aware_training.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
