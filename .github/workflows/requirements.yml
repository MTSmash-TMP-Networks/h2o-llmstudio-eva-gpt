name: Requirements

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".github/workflows/requirements.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".github/workflows/requirements.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requirements-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    name: Verify exported requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.20"

      - name: Regenerate requirements.txt
        run: make requirements

      - name: Verify requirements.txt is up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- requirements.txt; then
            echo "::error file=requirements.txt::requirements.txt is not synchronized with pyproject.toml and uv.lock. Run 'make requirements' and commit the result."
            exit 1
          fi
          echo "requirements.txt is up to date."
